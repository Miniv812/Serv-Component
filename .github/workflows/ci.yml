name: Continuous Integration

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Static Code Analysis (Linter)
        run: |
          ruff check .

      - name: Run Database Migrations Check
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
          JWT_SECRET_KEY: test-ci-secret-key
        run: |
          flask --app run db upgrade

      - name: Run Pytest Suite with PostgreSQL Service
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
          JWT_SECRET_KEY: test-ci-secret-key
        run: |
          pytest --maxfail=1 --disable-warnings -v

      - name: Build Docker Image
        run: |
          docker build -t expense-app:latest .

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
          