name: Continuous Integration

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Static Code Analysis (Linter)
        run: |
          ruff check .

      - name: Create Isolated Databases and Run Migrations
        env:
          PYTHONPATH: .
          USER_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/user_test_db
          EXPENSE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/expense_test_db
          JWT_SECRET_KEY: test-ci-secret-key
        run: |
          python -c "import psycopg; conn = psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True); conn.execute('CREATE DATABASE user_test_db'); conn.execute('CREATE DATABASE expense_test_db'); conn.close()"
          flask --app user_service/run db upgrade -d user_service/migrations
          flask --app expense_service/run db upgrade -d expense_service/migrations

      - name: Run Microservices and Observability Pytest Suite
        env:
          TEST_USER_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/user_test_db
          TEST_EXPENSE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/expense_test_db
          JWT_SECRET_KEY: test-ci-secret-key
        run: |
          pytest --maxfail=1 --disable-warnings -v

      - name: Validate Grafana Dashboard JSON and Docker Compose Stack
        run: |
          python -c "import json; json.load(open('monitoring/grafana/dashboards/expense_dashboard.json', encoding='utf-8'))"
          docker compose config

      - name: Build Microservice Docker Images
        run: |
          docker build -f user_service/Dockerfile -t user-service:latest .
          docker build -f expense_service/Dockerfile -t expense-service:latest .
        